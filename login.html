<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Phoenix Vanguard</title>
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <div class="container">
    <section class="admin-login-wrap">
      <div class="parchment">
        <div class="portal-brand">
          <a href="index.html" class="login-home-link" aria-label="Back to Phoenix Vanguard home" title="Back to home">
            <img src="assets/pdf-emblem-web.png" alt="" class="login-home-logo">
          </a>
          <p class="portal-brand-title">Phoenix Vanguard</p>
          <p class="portal-brand-subtitle">Management Portal</p>
        </div>

        <h3 class="section-heading">Sign In</h3>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password">
          </div>
          <div id="login-flash"></div>
          <button type="submit" id="login-submit" class="submit-btn">Sign In</button>
        </form>

        <a class="login-link" href="register.html">
          Need an account? Create one →
        </a>
      </div>
    </section>
  </div>

  <script src="js/pv-session.js"></script>
  <script src="js/api.js"></script>
  <script>
  (function () {
    var form = document.getElementById('loginForm');
    var flash = document.getElementById('login-flash');
    var btn = document.getElementById('login-submit');

    function showFlash(type, msg) {
      flash.innerHTML = '';
      if (!msg) return;
      var div = document.createElement('div');
      div.className = 'flash ' + type;
      div.textContent = msg;
      flash.appendChild(div);
    }

    // Optional same-site return path (e.g. the bounty board sends users back
    // after logging in to sign up). Anything off-site falls through to the
    // portal.
    var redirectTarget = (function () {
      try {
        var r = new URLSearchParams(window.location.search).get('redirect') || '';
        if (r) {
          var u = new URL(r, window.location.href);
          if (u.origin === window.location.origin) return u.pathname + u.search + u.hash;
        }
      } catch (_e) { /* ignore */ }
      return 'portal.html';
    })();

    // Already signed in (e.g. sent here by the live site's page gate before it
    // had this browser's sign-in): hand the sign-in to the renderer, then go
    // on. A sign-in it turns down has expired, so show the form. If this page
    // has already sent the visitor on twice in the last 30 seconds, stop and
    // say so rather than bounce between the two pages.
    if (PVAdminAPI.getSession()) {
      var bounces = [];
      try { bounces = JSON.parse(sessionStorage.getItem('pv.login.bounces') || '[]'); } catch (_e) { bounces = []; }
      bounces = bounces.filter(function (t) { return Date.now() - t < 30000; });
      if (bounces.length >= 2) {
        showFlash('error', 'That page could not be opened with your current sign-in. Sign out from your ' +
          'dashboard and sign in again, or contact an officer.');
      } else {
        bounces.push(Date.now());
        try { sessionStorage.setItem('pv.login.bounces', JSON.stringify(bounces)); } catch (_e) { /* ignore */ }
        PVSession.handoff().then(function (ok) {
          // Turned down: clear it and reload into the sign-in form.
          if (ok === false) { PVSession.clear(); window.location.reload(); return; }
          window.location.replace(redirectTarget);
        });
        return;
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var username = document.getElementById('login-username').value.trim();
      var password = document.getElementById('login-password').value;
      if (!username || !password) return;

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      showFlash('', '');

      try {
        var data = await PVAdminAPI.request('POST', '/auth/login', {
          username: username,
          password: password
        }, false);
        if (!data || !data.token) throw new Error('Sign in failed: no token returned.');

        PVAdminAPI.setSession({
          token: data.token,
          username: data.username || username,
          display_name: data.display_name || username,
          avatar_url: data.avatar_url || null,
          roles: data.roles || [],
          permissions: data.permissions || [],
          is_root: !!data.is_root,
          expires_at: data.expires_at || null
        });
        document.getElementById('login-password').value = '';
        await PVSession.handoff();
        window.location.replace(redirectTarget);
      } catch (err) {
        showFlash('error', err.status === 401 ? 'Incorrect Password' : (err.message || 'Sign in failed.'));
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  })();
  </script>
</body>
</html>
