<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Vanguard Calendar</title>

  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>

    <header class="app-header">
      <p class="app-subtitle">Phoenix Vanguard</p>
      <h1 class="app-title">Calendar</h1>
    </header>

    <p class="landing-intro cal-intro">Upcoming Phoenix Vanguard events.</p>

    <!-- Status region: shown for loading / sign-in / error / empty; hidden once
         the agenda renders. -->
    <div id="calendar-status"></div>

    <div class="campaign-layout" id="calendar-layout" hidden>

      <!-- Filter sidebar -->
      <aside class="campaign-sidebar venues-sidebar tear-half" id="calendar-sidebar" aria-label="Event filters">
        <div class="campaign-sidebar-header">
          <span class="campaign-sidebar-title">Filters</span>
          <button class="btn is-quiet is-small is-icon" id="sidebar-close-btn" type="button" aria-label="Close filters">&#10005;</button>
        </div>

        <div class="venues-filter-body">
          <div class="venues-filter-group">
            <label class="venues-filter-label" for="calendar-search">Search</label>
            <input
              id="calendar-search"
              class="venues-filter-input"
              type="search"
              placeholder="Title, location, keyword..."
              autocomplete="off"
            />
          </div>

          <div class="venues-filter-group" id="filter-category-group">
            <span class="venues-filter-label">Category</span>
            <ul class="venues-filter-list" id="filter-category-list" role="list"></ul>
          </div>

          <button type="button" class="btn is-plain" id="filter-reset">
            Reset filters
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <main class="campaign-main" id="calendar-main">
        <div class="campaign-toolbar venues-toolbar">
          <button class="btn is-quiet" id="sidebar-toggle-btn" type="button" aria-label="Toggle filters">
            &#9776; Filters
          </button>
          <div class="cal-viewtoggle seg" role="group" aria-label="Calendar view">
            <button type="button" class="seg-btn" id="view-month" aria-pressed="true">Month</button>
            <button type="button" class="seg-btn" id="view-week" aria-pressed="false">Week</button>
            <button type="button" class="seg-btn" id="view-agenda" aria-pressed="false">All Events</button>
          </div>
          <span class="venues-result-count" id="calendar-count" aria-live="polite"></span>
          <div class="cal-monthnav" id="cal-monthnav" hidden>
            <button type="button" class="btn is-quiet is-small is-icon" id="cal-prev" aria-label="Previous">&#8249;</button>
            <span class="cal-month-label" id="cal-period-label" aria-live="polite"></span>
            <button type="button" class="btn is-quiet is-small is-icon" id="cal-next" aria-label="Next">&#8250;</button>
            <button type="button" class="btn is-quiet is-small" id="cal-today-btn">Today</button>
          </div>
        </div>

        <div id="calendar-agenda">
          <!-- populated by JS -->
        </div>
        <div id="calendar-week" hidden>
          <!-- populated by JS -->
        </div>
        <div id="calendar-month" hidden>
          <!-- populated by JS -->
        </div>
      </main>
    </div>

    <!-- Mobile overlay -->
    <div class="campaign-overlay" id="campaign-overlay" aria-hidden="true"></div>

    <!-- Detail modal -->
    <div class="job-modal-overlay" id="calendar-modal-overlay" aria-hidden="true">
      <div class="job-modal" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-title">
        <button type="button" class="btn is-quiet is-small is-icon modal-close" id="calendar-modal-close" aria-label="Close">&#10005;</button>
        <div class="job-modal-body" id="calendar-modal-body">
          <!-- populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer" id="site-footer">
    <p class="site-footer-text">FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.</p>
  </footer>

  <script src="js/pv-session.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
