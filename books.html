<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Farm &mdash; Zodiac Weapons Checklist</title>
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>
    <header class="app-header">
      <h1 class="app-title">Trials of the Braves, Book Checklist</h1>
      <p class="app-subtitle">Stage 4 &middot; Animus Zodiac Weapons</p>
    </header>

    <div class="top-controls">
      <div class="job-selector">
        <label for="job-select">Job:</label>
        <select id="job-select"></select>
      </div>
    </div>

    <div class="overall-progress">
      <div class="overall-progress-label">
        <span>Overall Progress</span>
        <span id="overall-progress-text">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="overall-progress-fill"></div>
      </div>
    </div>

    <div id="books-container"></div>

    <div class="disclaimer">
      FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
      FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.
    </div>
  </div>

  <script src="js/pv-session.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
