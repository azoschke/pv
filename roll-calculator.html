<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Roll Calculator — Phoenix Vanguard</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">

  <meta property="og:image" content="https://images.phoenixvanguard-tools.com/pv-fc-share.jpg">
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <link rel="stylesheet" href="css/combat.css">
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>
    <div id="app"></div>
    <div class="disclaimer">
      FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
      FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.
    </div>
  </div>

  <script src="js/pv-session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rp-api.js"></script>
  <script src="js/rp-shared.js"></script>
  <script src="js/roll-calculator.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var root = ReactDOM.createRoot(document.getElementById('app'));
      if (typeof RollCalculator !== 'undefined') {
        root.render(React.createElement(RollCalculator));
      } else {
        root.render(React.createElement('div', { className: 'rp-gate' }, 'Failed to load the calculator. Reload the page.'));
      }
    });
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
