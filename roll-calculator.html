<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Roll Calculator — Phoenix Vanguard</title>

  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/MaterialSymbolsOutlined-trimmed.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <link rel="stylesheet" href="css/combat.css?v=3">
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>
    <div id="app"></div>
  </div>

  <footer class="site-footer" id="site-footer">
    <p class="site-footer-text">FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.</p>
  </footer>

  <script src="js/pv-session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rp-api.js"></script>
  <!-- ?v= changes whenever these must match each other: browsers keep scripts for hours -->
  <script src="js/rp-shared.js?v=3"></script>
  <script src="js/roll-calculator.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var root = ReactDOM.createRoot(document.getElementById('app'));
      if (typeof RollCalculator !== 'undefined') {
        root.render(React.createElement(RollCalculator));
      } else {
        root.render(React.createElement('div', { className: 'notice-panel is-gate rp-gate' }, 'Failed to load the calculator. Reload the page.'));
      }
    });
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
