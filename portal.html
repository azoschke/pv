<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Phoenix Vanguard</title>

  <meta name="robots" content="noindex, nofollow">
  <meta property="og:image" content="https://images.phoenixvanguard-tools.com/pv-fc-share.jpg">
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/MaterialSymbolsOutlined-trimmed.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/combat.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="portal-root">
    <div class="portal-boot">Loading…</div>
  </div>

  <script src="js/pv-session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rp-api.js"></script>
  <script src="js/admin/modal.js"></script>
  <script src="js/admin/subnav.js"></script>
  <script src="js/admin/image-upload.js"></script>
  <script src="js/admin/coming-soon.js"></script>
  <script src="js/admin/members.js"></script>
  <script src="js/admin/patients.js"></script>
  <script src="js/admin/medical-staff.js"></script>
  <script src="js/admin/announcements.js"></script>
  <script src="js/admin/faction-section.js"></script>
  <script src="js/admin/applications.js"></script>
  <script src="js/admin/venue-menus.js"></script>
  <script src="js/admin/venues.js"></script>
  <script src="js/admin/job-board.js"></script>
  <script src="js/admin/quest-form.js"></script>
  <script src="js/admin/my-profile.js"></script>
  <script src="js/admin/my-applications.js"></script>
  <script src="js/admin/bounties.js"></script>
  <script src="js/admin/event-assets.js"></script>
  <script src="js/admin/member-profiles.js"></script>
  <script src="js/admin/campaigns.js"></script>
  <script src="js/rp-shared.js"></script>
  <script src="js/admin/rp-rolls.js"></script>
  <script src="js/admin/cosmic-exploration.js"></script>
  <script src="js/admin/permissions.js"></script>
  <script src="js/admin/admin-settings.js"></script>
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/portal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!PVAdminAPI.getSession()) {
        window.location.replace('login.html');
        return;
      }
      var rootEl = document.getElementById('portal-root');
      var root = ReactDOM.createRoot(rootEl);
      if (typeof PVAdminPortal !== 'undefined') {
        root.render(React.createElement(PVAdminPortal));
      } else {
        rootEl.innerHTML = '<div style="color:var(--accent-red);padding:2rem;">Portal failed to load. Missing module: PVAdminPortal.</div>';
      }
    });
  </script>
</body>
</html>
