<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Phoenix Vanguard</title>

  <meta name="robots" content="noindex, nofollow">
  <meta property="og:image" content="https://images.phoenixvanguard-tools.com/pv-fc-share.jpg">
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="admin/portal.css">
  <link rel="stylesheet" href="css/combat.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <link href="https://fonts.googleapis.com/css2?family=Stoke:wght@300;400&family=La+Belle+Aurore&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="portal-root">
    <div class="portal-boot">Loading…</div>
  </div>

  <script src="js/pv-session.js"></script>
  <script src="admin/api.js"></script>
  <script src="js/rp-api.js"></script>
  <script src="admin/modal.js"></script>
  <script src="admin/subnav.js"></script>
  <script src="admin/coming-soon.js"></script>
  <script src="admin/members.js"></script>
  <script src="admin/patients.js"></script>
  <script src="admin/medical-staff.js"></script>
  <script src="admin/announcements.js"></script>
  <script src="admin/faction-section.js"></script>
  <script src="admin/applications.js"></script>
  <script src="admin/venue-menus.js"></script>
  <script src="admin/venues.js"></script>
  <script src="admin/job-board.js"></script>
  <script src="admin/quest-form.js"></script>
  <script src="admin/my-profile.js"></script>
  <script src="admin/my-applications.js"></script>
  <script src="admin/bounties.js"></script>
  <script src="admin/event-assets.js"></script>
  <script src="admin/member-profiles.js"></script>
  <script src="admin/campaigns.js"></script>
  <script src="js/rp-shared.js"></script>
  <script src="admin/rp-rolls.js"></script>
  <script src="admin/cosmic-exploration.js"></script>
  <script src="admin/permissions.js"></script>
  <script src="admin/admin-settings.js"></script>
  <script src="admin/dashboard.js"></script>
  <script src="admin/portal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!PVAdminAPI.getSession()) {
        window.location.replace('login.html');
        return;
      }
      var rootEl = document.getElementById('portal-root');
      var root = ReactDOM.createRoot(rootEl);
      if (typeof PVAdminPortal !== 'undefined') {
        root.render(React.createElement(PVAdminPortal));
      } else {
        rootEl.innerHTML = '<div style="color:var(--accent-red);padding:2rem;">Portal failed to load. Missing module: PVAdminPortal.</div>';
      }
    });
  </script>
</body>
</html>
