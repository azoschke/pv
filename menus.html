<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Vanguard Menus</title>
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>

    <header class="app-header">
      <p class="app-subtitle">Phoenix Vanguard</p>
      <h1 class="app-title">Venue Menus</h1>
    </header>

    <p class="landing-intro" id="menus-intro">
      Fare and drink served at company-affiliated taverns and restaurants.
      Choose a venue to read its menu.
    </p>

    <!-- Venue chooser — the landing state. -->
    <section id="menus-chooser" class="menus-chooser">
      <div id="menus-venue-grid" class="menu-venue-grid">
        <!-- populated by JS -->
      </div>
    </section>

    <!-- Menu view — replaces the chooser once a venue is picked. -->
    <section id="menus-view" class="menus-view" hidden>
      <button type="button" class="btn is-plain menu-back" id="menu-back-btn">
        &larr; All Menus
      </button>

      <article class="menu-sheet tear" id="menu-sheet">
        <!-- populated by JS -->
      </article>
    </section>
  </div>

  <footer class="site-footer" id="site-footer">
    <p class="site-footer-text">FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.</p>
  </footer>

  <script src="js/pv-session.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
