<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Vanguard Calendar</title>

  <meta property="og:image" content="https://images.phoenixvanguard-tools.com/pv-fc-share.jpg">
  <link rel="icon" href="/pv/assets/pdf-emblem-web.png" type="image/png">
  <link rel="stylesheet" href="/pv/css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
  <link href="https://fonts.googleapis.com/css2?family=Stoke:wght@300;400&family=La+Belle+Aurore&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

  <style>
    /* Calendar agenda — grouped-by-day list of Discord scheduled events.
       Reuses the campaign/venues sidebar+main layout from styles.css; only the
       agenda-specific chrome lives here. */

    .cal-intro { margin: 0 0 1.25rem; color: var(--text-secondary); }

    /* Day group: sticky header + its event rows. */
    .cal-day { margin-bottom: 1.5rem; }
    .cal-day-header {
      position: sticky; top: 0; z-index: 2;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem 0.2rem; margin-bottom: 0.5rem;
      font-family: 'Stoke', serif; letter-spacing: 0.03em;
      display: flex; align-items: baseline; gap: 0.6rem;
    }
    .cal-day-header.is-today { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
    .cal-day-weekday { font-size: 1.05rem; }
    .cal-day-date { font-size: 0.85rem; color: var(--text-secondary); }
    .cal-day-header.is-today .cal-day-date { color: var(--accent-gold); }
    .cal-today-tag {
      margin-left: auto; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
      border: 1px solid var(--accent-gold); color: var(--accent-gold);
      border-radius: 2rem; padding: 0.05rem 0.5rem;
    }

    /* Event row — click to open detail. */
    .cal-event {
      display: flex; align-items: stretch; gap: 0.85rem; width: 100%;
      text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 0.55rem; padding: 0.7rem 0.85rem; margin-bottom: 0.5rem;
      transition: border-color 0.15s ease, transform 0.05s ease;
    }
    .cal-event:hover { border-color: var(--accent-brown); }
    .cal-event:active { transform: translateY(1px); }

    .cal-event-time {
      flex: 0 0 5.2rem; display: flex; flex-direction: column; gap: 0.1rem;
      font-variant-numeric: tabular-nums; padding-right: 0.85rem;
      border-right: 1px solid var(--border-color);
    }
    .cal-event-start { font-size: 1.02rem; }
    .cal-event-end { font-size: 0.78rem; color: var(--text-secondary); }

    .cal-event-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.28rem; }
    .cal-event-title-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .cal-event-title { font-family: 'Stoke', serif; font-size: 1.05rem; overflow-wrap: anywhere; }
    .cal-event-meta { display: flex; align-items: center; gap: 0.5rem 0.9rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary); }
    .cal-event-loc { display: inline-flex; align-items: center; gap: 0.3rem; overflow-wrap: anywhere; }

    .cal-event-thumb {
      flex: 0 0 3.4rem; width: 3.4rem; height: 3.4rem; align-self: center;
      border-radius: 0.4rem; object-fit: cover; border: 1px solid var(--border-color);
    }

    /* Category badge — one accent per prefix. */
    .cal-badge {
      display: inline-flex; align-items: center;
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
      border-radius: 2rem; padding: 0.08rem 0.55rem;
      border: 1px solid var(--border-color); color: var(--text-secondary);
      white-space: nowrap;
    }
    .cal-badge[data-cat="rp"]              { border-color: #7b5cc0; color: #b79cf0; }
    .cal-badge[data-cat="rp-campaign"]     { border-color: #a54d9c; color: #e0a0d8; }
    .cal-badge[data-cat="community-event"] { border-color: #4d86a5; color: #97c8e6; }
    .cal-badge[data-cat="seasonal"]        { border-color: #4da572; color: #93dcae; }
    .cal-badge[data-cat="pve"]             { border-color: #a55a4d; color: #e6a197; }
    .cal-badge[data-cat="collab"]          { border-color: #a58a4d; color: #e6cd97; }
    .cal-badge[data-cat="event"]           { border-color: #6b7280; color: #b7bcc4; }
    .cal-badge[data-cat="fc"]              { border-color: #c0913c; color: var(--accent-gold); }

    .cal-recurring {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.72rem; color: var(--text-secondary);
    }

    /* Status region: loading / gate / error / empty. */
    .cal-panel {
      max-width: 520px; margin: 3rem auto; text-align: center;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 0.75rem; padding: 2.25rem 1.75rem;
    }
    .cal-panel h2 { font-family: 'Stoke', serif; margin: 0 0 0.5rem; }
    .cal-panel p { color: var(--text-secondary); margin: 0 0 1.25rem; }
    .cal-panel-btn {
      display: inline-block; border: 1px solid var(--accent-brown); background: var(--accent-brown);
      color: #fff; padding: 0.5rem 1.1rem; border-radius: 0.4rem; cursor: pointer;
      text-decoration: none; font: inherit;
    }
    .cal-empty { color: var(--text-secondary); text-align: center; padding: 2.5rem 1rem; }

    /* Detail modal reuses .job-modal-* from styles.css; a couple of additions. */
    .cal-modal-media {
      width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      border-radius: 0.5rem; margin-bottom: 1rem; border: 1px solid var(--border-color);
    }
    .cal-modal-title { font-family: 'Stoke', serif; font-size: 1.4rem; margin: 0.4rem 0 0.6rem; }
    .cal-modal-meta { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; font-size: 0.95rem; }
    .cal-modal-meta-row { display: flex; gap: 0.5rem; }
    .cal-modal-meta-label { flex: 0 0 5rem; color: var(--text-secondary); }
    .cal-modal-desc { white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="container">
    <div id="nav-placeholder"></div>

    <header class="app-header">
      <p class="app-subtitle">Phoenix Vanguard</p>
      <h1 class="app-title">Calendar</h1>
    </header>

    <p class="landing-intro cal-intro">
      Upcoming Phoenix Vanguard events, pulled live from our Discord and grouped by day.
      Filter by category to find what's for you.
    </p>

    <!-- Status region: shown for loading / sign-in / error / empty; hidden once
         the agenda renders. -->
    <div id="calendar-status"></div>

    <div class="campaign-layout" id="calendar-layout" hidden>

      <!-- Filter sidebar -->
      <aside class="campaign-sidebar venues-sidebar" id="calendar-sidebar" aria-label="Event filters">
        <div class="campaign-sidebar-header">
          <span class="campaign-sidebar-title">Filters</span>
          <button class="campaign-sidebar-close-btn" id="sidebar-close-btn" type="button" aria-label="Close filters">&#10005;</button>
        </div>

        <div class="venues-filter-body">
          <div class="venues-filter-group">
            <label class="venues-filter-label" for="calendar-search">Search</label>
            <input
              id="calendar-search"
              class="venues-filter-input"
              type="search"
              placeholder="Title, location, keyword..."
              autocomplete="off"
            />
          </div>

          <div class="venues-filter-group" id="filter-category-group">
            <span class="venues-filter-label">Category</span>
            <ul class="venues-filter-list" id="filter-category-list" role="list"></ul>
          </div>

          <button type="button" class="venues-filter-reset" id="filter-reset">
            Reset filters
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <main class="campaign-main" id="calendar-main">
        <div class="campaign-toolbar venues-toolbar">
          <button class="campaign-sidebar-toggle-btn" id="sidebar-toggle-btn" type="button" aria-label="Toggle filters">
            &#9776; Filters
          </button>
          <span class="venues-result-count" id="calendar-count" aria-live="polite"></span>
          <button type="button" class="venues-filter-reset" id="calendar-refresh" title="Refresh from Discord">
            &#8635; Refresh
          </button>
        </div>

        <div id="calendar-agenda">
          <!-- populated by JS -->
        </div>
      </main>
    </div>

    <!-- Mobile overlay -->
    <div class="campaign-overlay" id="campaign-overlay" aria-hidden="true"></div>

    <!-- Detail modal -->
    <div class="job-modal-overlay" id="calendar-modal-overlay" aria-hidden="true">
      <div class="job-modal" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-title">
        <button type="button" class="job-modal-close" id="calendar-modal-close" aria-label="Close">&#10005;</button>
        <div class="job-modal-body" id="calendar-modal-body">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <div class="disclaimer">
      FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
      FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.
    </div>
  </div>

  <script src="/pv/admin/api.js"></script>
  <script src="/pv/calendar/calendar.js"></script>
  <script src="/pv/js/nav.js"></script>
</body>
</html>
