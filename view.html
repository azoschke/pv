<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — Phoenix Vanguard</title>
  <link rel="icon" href="assets/pdf-emblem-web.png" type="image/png">
  <link rel="preload" href="assets/CrimsonPro-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/Stoke-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
</head>
<body>

  <div class="container">
    <div id="nav-placeholder"></div>

    <header class="app-header">
      <p class="app-subtitle" id="campaign-subtitle">Phoenix Vanguard</p>
      <h1 class="app-title" id="campaign-title">Campaign</h1>
      <nav class="campaign-breadcrumb" aria-label="Breadcrumb">
        <a href="campaigns.html" class="campaign-breadcrumb-link">Campaigns</a>
        <span class="campaign-breadcrumb-sep" aria-hidden="true">/</span>
        <span class="campaign-breadcrumb-current" id="campaign-breadcrumb-current" aria-current="page">Campaign</span>
      </nav>
    </header>

    <!-- Reading column: the chapter bar above a torn chapter sheet. -->
    <main class="chapter-reader" id="campaign-main">

      <!-- Chapter bar. Hidden until load decides: single-chapter campaigns
           never show it (avoids a flash), multi-chapter campaigns show it once
           the chapter list is ready. -->
      <nav class="chapter-bar" id="chapter-bar" aria-label="Chapters" hidden>
        <button class="btn is-quiet" id="chapter-prev" type="button">&larr; Previous</button>
        <div class="chapter-bar-pick">
          <label class="chapter-bar-count" for="chapter-select" id="chapter-count">Chapter</label>
          <select class="chapter-select" id="chapter-select">
            <!-- populated by JS from the campaigns worker -->
          </select>
        </div>
        <button class="btn is-quiet" id="chapter-next" type="button">Next &rarr;</button>
      </nav>

      <div id="chapter-content" class="chapter-view tear">
        <div class="chapter-loading">Loading&hellip;</div>
      </div>
    </main>
  </div><!-- /.container -->

  <footer class="site-footer" id="site-footer">
    <p class="site-footer-text">FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br>
    FINAL FANTASY XIV &copy; SQUARE ENIX CO., LTD.</p>
  </footer>

  <!-- Shared markdown utilities, then page logic -->
  <script src="js/campaigns.js"></script>
  <script>
  (function () {

    var API_BASE = 'https://pv-campaigns-worker.chlorinatorgreen.workers.dev';

    // Campaign type → the small-caps subtitle shown above the title.
    var CATEGORY_LABEL = { main: 'Main Campaign', side: 'Side Campaign', oneshot: 'One-Shots' };

    // Campaign slug comes from ?c=<slug>; the active chapter from ?ch=<slug>.
    // Both live in the URL so every chapter has a permanent, shareable link.
    var params         = new URLSearchParams(window.location.search);
    var campaignSlug   = (params.get('c') || '').trim();

    var campaign      = null;   // { id, slug, name, tag, blurb }
    var chapters      = [];     // [{ id, slug, title, chapter_date, has_tldr }]
    var activeSlug    = null;
    var showingTldr   = false;
    var singleChapter = false;  // hide chapter nav/label when a campaign has one chapter
    var chapterCache  = {};     // chapterSlug -> { main: html, tldr: html|null }

    // DOM refs (resolved after DOMContentLoaded)
    var chapterBar     = null;
    var chapterSelect  = null;
    var chapterCount   = null;
    var prevBtn        = null;
    var nextBtn        = null;
    var chapterContent = null;

    // ── URL sync ─────────────────────────────────────────────────────────────
    function chapterHref(slug) {
      var qs = '?c=' + encodeURIComponent(campaignSlug);
      if (slug) qs += '&ch=' + encodeURIComponent(slug);
      return qs;
    }
    function syncUrl() {
      history.replaceState(null, '', chapterHref(activeSlug));
    }

    // ── Chapter bar ───────────────────────────────────────────────────────────
    // Previous / "Chapter N of M" with a select of every chapter / Next.
    function chapterIndex(slug) {
      for (var i = 0; i < chapters.length; i++) {
        if (chapters[i].slug === slug) return i;
      }
      return -1;
    }

    function chapterOptionLabel(ch) {
      return ch.chapter_date ? ch.title + ' · ' + ch.chapter_date : ch.title;
    }

    function buildChapterBar() {
      chapterSelect.innerHTML = '';
      chapters.forEach(function (ch) {
        var opt = document.createElement('option');
        opt.value = ch.slug;
        opt.textContent = chapterOptionLabel(ch);
        chapterSelect.appendChild(opt);
      });
    }

    function updateChapterBar(slug) {
      var i = chapterIndex(slug);
      chapterSelect.value = slug;
      chapterCount.textContent = 'Chapter ' + (i + 1) + ' of ' + chapters.length;
      prevBtn.disabled = i <= 0;
      nextBtn.disabled = i < 0 || i >= chapters.length - 1;
    }

    function stepChapter(delta) {
      var next = chapters[chapterIndex(activeSlug) + delta];
      if (next) loadChapter(next.slug);
    }

    // ── Chapter loading & rendering ───────────────────────────────────────────
    function loadChapter(slug) {
      if (activeSlug === slug) return;
      activeSlug = slug;
      showingTldr = false;

      if (!singleChapter) updateChapterBar(slug);
      syncUrl();

      if (chapterCache[slug]) {
        renderChapter(slug, chapterCache[slug]);
        return;
      }

      chapterContent.innerHTML = '<div class="chapter-loading">Loading&hellip;</div>';

      fetch(API_BASE + '/campaigns/' + encodeURIComponent(campaignSlug) +
            '/chapters/' + encodeURIComponent(slug))
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (ch) {
          var data = {
            title: ch.title,
            date:  ch.chapter_date || '',
            main:  CampaignUtils.parseMarkdown(ch.body_md || ''),
            tldr:  ch.tldr_md ? CampaignUtils.parseMarkdown(ch.tldr_md) : null
          };
          chapterCache[slug] = data;
          renderChapter(slug, data);
        })
        .catch(function (err) {
          chapterContent.innerHTML = '<div class="chapter-error">Could not load this chapter. Please try again later.</div>';
          console.error('[campaign] chapter load error:', err);
        });
    }

    function renderChapter(slug, data) {
      var hasTldr = !!data.tldr;

      // At the end of the sheet, a link on to the next chapter (a real link,
      // so it can be opened in a new tab; a plain click stays on the page).
      var next = singleChapter ? null : chapters[chapterIndex(slug) + 1];
      var nextHtml = next
        ? '<a class="chapter-next-link" id="chapter-next-link" href="' + escapeHtml(chapterHref(next.slug)) + '">' +
            '<span>' +
              '<small>Next chapter</small>' +
              '<strong>' + escapeHtml(next.title) + '</strong>' +
              (next.chapter_date ? '<em>' + escapeHtml(next.chapter_date) + '</em>' : '') +
            '</span>' +
            '<span class="chapter-next-arrow" aria-hidden="true">&rarr;</span>' +
          '</a>'
        : '';

      chapterContent.innerHTML =
        '<div class="chapter-view-header">' +
          '<div class="chapter-view-meta">' +
            (singleChapter ? '' : '<p class="chapter-view-label">Chapter</p>') +
            '<h2 class="chapter-view-title">' + escapeHtml(data.title) + '</h2>' +
            '<p class="chapter-view-date">'  + escapeHtml(data.date)  + '</p>' +
          '</div>' +
          (hasTldr
            ? '<button class="btn is-quiet is-small" id="tldr-toggle-btn" type="button" aria-pressed="false">TL;DR</button>'
            : '') +
        '</div>' +
        '<div class="chapter-body" id="chapter-body-main">' + data.main + '</div>' +
        (hasTldr
          ? '<div class="chapter-body chapter-body--tldr" id="chapter-body-tldr" hidden>' + data.tldr + '</div>'
          : '') +
        nextHtml;

      // Drop cap on the chapter's first paragraph (the author also writes
      // paragraphs as # headings, which render as prose).
      var firstPara = document.getElementById('chapter-body-main').querySelector(':scope > p, :scope > h1');
      if (firstPara) firstPara.classList.add('drop');

      if (next) {
        document.getElementById('chapter-next-link').addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          e.preventDefault();
          loadChapter(next.slug);
          document.getElementById('campaign-main').scrollIntoView({ block: 'start' });
        });
      }

      if (hasTldr) {
        document.getElementById('tldr-toggle-btn').addEventListener('click', function () {
          showingTldr = !showingTldr;
          this.classList.toggle('active', showingTldr);
          this.setAttribute('aria-pressed', showingTldr ? 'true' : 'false');
          var mainBody = document.getElementById('chapter-body-main');
          var tldrBody = document.getElementById('chapter-body-tldr');
          if (showingTldr) { mainBody.hidden = true;  tldrBody.removeAttribute('hidden'); }
          else             { mainBody.removeAttribute('hidden'); tldrBody.hidden = true; }
        });
      }
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showFatal(msg) {
      chapterContent.innerHTML = '<div class="chapter-error">' + escapeHtml(msg) + '</div>';
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function init() {
      chapterBar     = document.getElementById('chapter-bar');
      chapterSelect  = document.getElementById('chapter-select');
      chapterCount   = document.getElementById('chapter-count');
      prevBtn        = document.getElementById('chapter-prev');
      nextBtn        = document.getElementById('chapter-next');
      chapterContent = document.getElementById('chapter-content');

      chapterSelect.addEventListener('change', function () { loadChapter(chapterSelect.value); });
      prevBtn.addEventListener('click', function () { stepChapter(-1); });
      nextBtn.addEventListener('click', function () { stepChapter(1); });

      if (!campaignSlug) {
        showFatal('No campaign specified. Return to the Campaigns page and pick one.');
        return;
      }

      fetch(API_BASE + '/campaigns/' + encodeURIComponent(campaignSlug))
        .then(function (res) {
          if (res.status === 404) throw new Error('not-found');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          campaign = data;
          chapters = Array.isArray(data.chapters) ? data.chapters : [];

          document.title = campaign.name + ' — Phoenix Vanguard';
          document.getElementById('campaign-title').textContent = campaign.name;
          var subtitle = document.getElementById('campaign-subtitle');
          if (subtitle) subtitle.textContent = CATEGORY_LABEL[campaign.tag] || 'Phoenix Vanguard';
          var crumb = document.getElementById('campaign-breadcrumb-current');
          if (crumb) crumb.textContent = campaign.name;

          if (!chapters.length) {
            showFatal('This campaign has no chapters yet.');
            return;
          }

          // The chapter bar starts hidden (see markup). Reveal it only for
          // multi-chapter campaigns; single-chapter campaigns (e.g. one-shots)
          // keep it hidden and also drop the "Chapter" label, with no flash.
          singleChapter = chapters.length === 1;
          if (!singleChapter) {
            buildChapterBar();
            chapterBar.hidden = false;
          }

          var wanted = (params.get('ch') || '').trim();
          var target = chapters.find(function (c) { return c.slug === wanted; }) || chapters[0];
          loadChapter(target.slug);
        })
        .catch(function (err) {
          if (err && err.message === 'not-found') {
            showFatal('Campaign not found. It may have been renamed or removed.');
          } else {
            showFatal('Could not load this campaign. Please try again later.');
          }
          console.error('[campaign] load error:', err);
        });
    }

    document.addEventListener('DOMContentLoaded', init);

  })();
  </script>

  <script src="js/pv-session.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
