<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Roll Calculator — Phoenix Vanguard</title>

  <link href="https://fonts.googleapis.com/css2?family=Stoke:wght@300;400&family=La+Belle+Aurore&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0" rel="stylesheet">

  <link rel="icon" href="/pv/assets/pdf-emblem-web.png" type="image/png">
  <link rel="stylesheet" href="/pv/css/styles.css">
  <script>(function(){var t=localStorage.getItem('crafting-tools-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* ── RollCalculator v7 — borderless. Surfaces separate by elevation, not
       outlines: page = --bg-primary, panels = --bg-card, raised/selected =
       --bg-card-light, input wells = --bg-darker. Focus shows a soft ring, not a
       border. Buttons on --accent-brown use dark ink; heal = --check-color,
       damage = --accent-red; --accent-gold is not used (too dim in dark mode). */
    .rp-tool, .rp-gate { --rp-btn-ink: #ffffff; --rp-ring: 0 0 0 2px rgba(168,137,89,0.4); }
    [data-theme="dark"] .rp-tool, [data-theme="dark"] .rp-gate { --rp-btn-ink: #241d17; }

    .rp-tool { max-width: 1100px; margin: 0 auto; padding: 0 0.5rem 3rem; }
    .rp-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0 1.25rem; }
    .rp-header h1 { margin: 0; font-family: 'Stoke', serif; }
    .rp-sub { margin: 0.2rem 0 0; color: var(--text-secondary); }
    .rp-me { text-align: right; display: flex; flex-direction: column; }
    .rp-me strong { font-size: 1.05rem; }
    .rp-me span { color: var(--text-secondary); font-size: 0.9rem; }
    .rp-me-id { display: flex; align-items: center; gap: 0.45rem; justify-content: flex-end; }

    .rp-section-label { margin: 0 0 0.6rem; font-family: 'Stoke', serif; letter-spacing: 0.04em; font-size: 1.05rem; }

    .rp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 860px) { .rp-grid { grid-template-columns: 1fr; } }
    .rp-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    /* Tabs + composer are one unit — tighter than the 1rem column gap. */
    .rp-action-col { gap: 0.5rem; }
    /* Keep the action composer in view while a long roster scrolls. */
    @media (min-width: 861px) { .rp-action-col { position: sticky; top: 1rem; align-self: start; } }

    .rp-card { background: var(--bg-card); border-radius: 0.6rem; padding: 1rem 1.1rem; }

    /* Filled wells — inputs, selects, number fields. No border; focus = soft ring. */
    .rp-input, .rp-select, .rp-buff-val, .rp-hp-input, .rp-hits-input {
      font-family: inherit; color: var(--text-primary); background: var(--bg-darker); border: 0; border-radius: 0.4rem; box-sizing: border-box; }
    .rp-input:focus, .rp-select:focus, .rp-buff-val:focus, .rp-hp-input:focus, .rp-hits-input:focus,
    .rp-roll-hero:focus-within, .rp-item-tile:focus-visible, .rp-party-row.is-pickable:focus-visible,
    .rp-boss-card.is-pickable:focus-visible, .rp-skills-btn:focus-visible { outline: none; box-shadow: var(--rp-ring); }
    .rp-input { display: block; width: 100%; padding: 0.5rem 0.6rem; font-size: 1.05rem; }
    .rp-input-label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
    .rp-input-label .rp-input { margin-top: 0.25rem; }
    .rp-select { padding: 0.4rem 0.55rem; font-size: 1rem; }

    .rp-note { margin: 0.5rem 0 0; font-size: 0.8rem; color: var(--text-secondary); }
    .rp-note-warn { color: var(--accent-red); }
    .rp-note-ok { color: var(--check-color); }
    .rp-divider { height: 1px; background: var(--border-color); margin: 0.3rem 0; }

    /* Buttons — filled brown with dark ink; ghost + danger variants. */
    .rp-btn { display: inline-flex; align-items: center; gap: 0.3rem; border: 0; background: var(--accent-brown); color: var(--rp-btn-ink);
      padding: 0.5rem 0.9rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font: inherit; }
    .rp-btn.is-small { padding: 0.25rem 0.6rem; font-size: 0.9rem; }
    .rp-btn.is-active { background: var(--accent-brown); box-shadow: var(--rp-ring); }
    .rp-btn.is-ghost { background: var(--bg-card-light); color: var(--text-primary); }
    .rp-btn.is-danger { background: var(--accent-red); color: var(--rp-btn-ink); }
    .rp-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    .rp-chip-x { background: none; border: 0; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0.1rem 0.2rem; }

    /* Full-width commit button — the composer's primary action. */
    .rp-commit { display: block; width: 100%; border: 0; background: var(--accent-brown); color: var(--rp-btn-ink);
      font-family: 'Stoke', serif; font-size: 1rem; padding: 0.6rem 1rem; border-radius: 0.5rem; cursor: pointer; }
    .rp-commit[disabled] { opacity: 0.45; cursor: not-allowed; }

    /* ── Tabbed action card ── */
    .rp-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0; }
    .rp-tab { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; background: var(--bg-card); border: 0;
      border-radius: 0.6rem; padding: 0.75rem 0.4rem; cursor: pointer; color: var(--text-primary); font: inherit; }
    .rp-tab-icon { font-size: 1.5rem; color: var(--text-secondary); }
    .rp-tab-label { font-family: 'Stoke', serif; font-size: 1.05rem; }
    .rp-tab-sub { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
    .rp-tab.is-active { background: var(--accent-brown); color: var(--rp-btn-ink); }
    .rp-tab.is-active .rp-tab-icon, .rp-tab.is-active .rp-tab-sub { color: var(--rp-btn-ink); }
    .rp-tab.is-unavail:not(.is-active) { opacity: 0.5; }

    .rp-composer-wrap { background: var(--bg-card); border-radius: 0.6rem; padding: 1rem 1.1rem; }
    .rp-composer { display: flex; flex-direction: column; gap: 0.85rem; }

    /* Hero roll input + chip breakdown, side by side (wraps on mobile). */
    .rp-roll-line { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .rp-roll-hero { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; background: var(--bg-darker);
      border-radius: 0.6rem; padding: 0.6rem 0.9rem; min-width: 6.5rem; }
    .rp-roll-input { width: 100%; min-width: 3rem; background: none; border: 0; color: var(--text-primary); font-family: 'Stoke', serif;
      font-size: 2.6rem; line-height: 1; text-align: center; -moz-appearance: textfield; }
    .rp-roll-input::-webkit-outer-spin-button, .rp-roll-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .rp-roll-input:focus { outline: none; }
    .rp-roll-caption { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); }

    .rp-chip-expr { display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem; }
    .rp-chip { background: var(--bg-card-light); color: var(--text-secondary); border-radius: 1rem; padding: 0.25rem 0.6rem; font-size: 0.9rem; }
    .rp-chip-op { color: var(--text-secondary); font-size: 0.95rem; }
    .rp-chip-result { font-weight: 700; font-size: 1rem; padding: 0.3rem 0.7rem; }
    .tone-damage { color: var(--accent-red); }
    .tone-heal { color: var(--check-color); }
    .tone-neutral { color: var(--text-primary); }
    .rp-chip-result.tone-damage { background: color-mix(in srgb, var(--accent-red) 16%, transparent); }
    .rp-chip-result.tone-heal { background: color-mix(in srgb, var(--check-color) 16%, transparent); }
    .rp-chip-result.tone-neutral { background: var(--bg-card-light); }

    /* Target read-out + selector. */
    .rp-target-block { display: flex; flex-direction: column; gap: 0.55rem; }
    .rp-target-label { margin: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
    .rp-target-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .rp-target-name { font-weight: 600; }
    .rp-target-newhp { background: var(--bg-card-light); border-radius: 1rem; padding: 0.3rem 0.75rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
    .rp-target-select { min-width: 12rem; max-width: 100%; }

    /* Single / AOE segmented control. */
    .rp-seg { display: inline-flex; background: var(--bg-darker); border-radius: 0.5rem; padding: 0.15rem; align-self: flex-start; gap: 0.15rem; }
    .rp-seg-btn { border: 0; background: none; color: var(--text-secondary); padding: 0.3rem 0.85rem; cursor: pointer; font: inherit; border-radius: 0.4rem; }
    .rp-seg-btn.is-active { background: var(--accent-brown); color: var(--rp-btn-ink); }

    /* AOE distribute list. */
    .rp-heal-targets { display: flex; flex-direction: column; gap: 0.3rem; }
    .rp-heal-target { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.35rem 0.55rem;
      border-radius: 0.4rem; background: var(--bg-card-light); }
    .rp-buff-val { padding: 0.3rem 0.45rem; font-size: 1rem; width: 4rem; }

    /* ── Battlefield (enemies) ── */
    .rp-battlefield { margin-bottom: 1.25rem; }
    /* Stretch so every enemy card in a row shares the tallest one's height. */
    .rp-bossbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.6rem; align-items: stretch; }
    .rp-boss-card { position: relative; display: flex; align-items: flex-start; gap: 0.7rem; background: var(--bg-card);
      border-radius: 0.6rem; padding: 0.7rem 0.85rem; }
    .rp-boss-card.is-pickable { cursor: pointer; }
    .rp-boss-card.is-pickable:hover { background: var(--bg-card-light); }
    .rp-boss-card.is-target { background: var(--bg-card-light); box-shadow: var(--rp-ring); }
    .rp-boss-card.is-down { opacity: 0.5; }
    .rp-boss-target-note { margin-top: 0.3rem; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-brown); }
    .rp-boss-img { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
    .rp-boss-info { flex: 1 1 auto; min-width: 0; }
    .rp-boss-name { font-family: 'Stoke', serif; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .rp-boss-down-tag, .rp-boss-vuln-tag { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);
      background: var(--bg-darker); border-radius: 0.3rem; padding: 0.05rem 0.35rem; }
    /* HP row: bar + number, with the DM eye (hides the HP number) inline so it
       clearly toggles HP rather than the whole boss. */
    .rp-boss-hp-line { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
    .rp-boss-hp { display: flex; align-items: center; gap: 0.5rem; flex: 1 1 auto; min-width: 0; }
    .rp-boss-hp.is-hidden { color: var(--text-secondary); font-size: 0.85rem; gap: 0.35rem; }
    .rp-boss-hp.is-hidden .material-icons { font-size: 1rem; }
    .rp-boss-hp-num { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }
    .rp-boss-hp-hidden { margin-top: 0.25rem; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
    .rp-hpbar { flex: 1 1 auto; height: 0.5rem; background: var(--bg-darker); border-radius: 0.4rem; overflow: hidden; }
    .rp-hpbar-fill { height: 100%; background: var(--accent-red); border-radius: 0.4rem; transition: width 0.4s ease; }
    .rp-boss-dots { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
    .rp-boss-dot { display: inline-flex; align-items: center; gap: 0.2rem; font-size: 0.78rem; color: var(--text-secondary);
      background: var(--bg-darker); border-radius: 2rem; padding: 0.05rem 0.5rem; }
    .rp-boss-skills { margin-top: 0.4rem; }
    .rp-boss-skills-toggle { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
    .rp-boss-skills-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 1.05rem; height: 1.05rem;
      padding: 0 0.25rem; margin-left: 0.4rem; border-radius: 0.6rem; background: var(--accent-red); color: var(--rp-btn-ink); font-size: 0.68rem; font-weight: 700; }
    /* Expanded revealed skills float as a popover so they don't grow the card
       (and, with the stretch grid, its neighbours) — the row keeps the tallest
       closed card's height. */
    .rp-boss-skills-pop { position: absolute; left: 0; right: 0; top: 100%; margin-top: 0.3rem; z-index: 5;
      background: var(--bg-card); border-radius: 0.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.4); padding: 0.5rem 0.7rem; }
    .rp-boss-tele { font-size: 0.85rem; color: var(--text-secondary); margin: 0.25rem 0 0; line-height: 1.35; }
    .rp-boss-tele strong { font-family: 'Stoke', serif; color: var(--text-secondary); }
    .rp-boss-eye { flex: 0 0 auto; display: inline-flex; background: none; border: 0; cursor: pointer; color: var(--text-secondary); padding: 0.1rem; }
    .rp-boss-eye .material-icons { font-size: 1.05rem; }

    /* ── Party roster ── */
    .rp-party-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
    .rp-party-head .rp-section-label { margin: 0; }
    .rp-skills-btn { position: relative; display: inline-flex; align-items: center; gap: 0.35rem; background: var(--bg-card-light);
      border: 0; border-radius: 2rem; padding: 0.35rem 0.8rem; cursor: pointer; color: var(--text-primary); font: inherit; font-size: 0.85rem; }
    .rp-skills-btn .material-symbols-outlined { font-size: 1.05rem; color: var(--accent-brown); }
    .rp-skills-badge { position: absolute; top: -0.35rem; right: -0.35rem; min-width: 1.15rem; height: 1.15rem; padding: 0 0.25rem; box-sizing: border-box;
      display: inline-flex; align-items: center; justify-content: center; border-radius: 0.7rem; background: var(--accent-red); color: var(--rp-btn-ink);
      font-size: 0.72rem; font-weight: 700; }
    .rp-party { display: flex; flex-direction: column; gap: 0.15rem; }
    .rp-party-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem; border-radius: 0.5rem; }
    .rp-party-row.is-me { background: var(--bg-card-light); }
    .rp-party-row.is-target { box-shadow: var(--rp-ring); }
    .rp-party-row.is-pickable { cursor: pointer; }
    .rp-party-row.is-pickable:hover { background: var(--bg-card-light); }
    .rp-party-row.is-elim { opacity: 0.5; }
    .rp-avatar { width: 1.9rem; height: 1.9rem; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
    .rp-avatar-fallback { display: inline-flex; align-items: center; justify-content: center; background: var(--accent-brown); color: var(--rp-btn-ink);
      font-family: 'Stoke', serif; font-size: 0.82rem; }
    .rp-me-id .rp-avatar { width: 2rem; height: 2rem; }
    .rp-party-id { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
    .rp-party-name { font-size: 0.95rem; overflow-wrap: anywhere; }
    .rp-party-role { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
    .rp-elim-tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-red); }
    .rp-party-stats { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }
    .rp-heal-pill { background: color-mix(in srgb, var(--check-color) 18%, transparent); color: var(--check-color);
      border-radius: 1rem; padding: 0.15rem 0.55rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .rp-hp-edit, .rp-shield-edit { display: inline-flex; align-items: center; gap: 0.3rem; }
    .rp-hp-edit .material-icons { font-size: 1rem; color: var(--accent-red); }
    .rp-shield-edit { color: var(--text-secondary); }
    .rp-shield-edit .material-icons { font-size: 1rem; color: var(--text-secondary); }
    .rp-shield-edit.is-on .material-icons { color: var(--accent-brown); }

    /* Steppers — filled neutral wells; ± glyphs tinted by context. */
    .rp-stepper { display: inline-flex; align-items: center; gap: 0.3rem; }
    /* Translucent lighten so the step buttons keep contrast on any row shade,
       including the raised (is-me) highlight where a flat fill would vanish. */
    .rp-step-btn { display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--text-secondary) 16%, transparent); border: 0;
      border-radius: 0.4rem; padding: 0.15rem 0.3rem; cursor: pointer; color: var(--text-secondary); }
    .rp-step-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    .rp-step-btn .material-symbols-outlined { font-size: 1rem; font-variation-settings: 'wght' 600; }
    .rp-hp-edit .rp-step-btn .material-symbols-outlined { color: var(--accent-red); }
    .rp-step-val { min-width: 3.2rem; text-align: center; font-variant-numeric: tabular-nums; }
    .rp-step-val.is-compact { min-width: 1.4rem; }
    .rp-hp-input { width: 3.1rem; padding: 0.2rem 0.3rem; text-align: center; font: inherit; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
    .rp-hp-input.is-compact { width: 2.3rem; }
    .rp-hp-input::-webkit-outer-spin-button, .rp-hp-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .rp-hp-max { color: var(--text-secondary); font-size: 0.78rem; white-space: nowrap; }
    /* Party number fields use the same translucent fill as the steppers so they
       stay legible on the raised (is-me) row too. */
    .rp-party .rp-hp-input { background: color-mix(in srgb, var(--text-secondary) 16%, transparent); }
    /* Narrow screens: portrait + name on top, stats on a full-width line beneath. */
    @media (max-width: 600px) {
      .rp-party-row { flex-wrap: wrap; row-gap: 0.35rem; }
      .rp-party-id { flex: 1 1 0; }
      .rp-party-stats { flex: 1 0 100%; margin-left: 0; flex-wrap: wrap; gap: 0.3rem 1rem; }
    }

    /* ── Items image strip + inline detail ── */
    .rp-items-panel { margin-top: 1rem; }
    .rp-items-strip { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.75rem; }
    /* Mini-card: image flush to the top edges, name padded on the card body
       below, torn edge (contrast-border-half fills --bg-card) tearing the image
       into that body. */
    .rp-item-tile { display: flex; flex-direction: column; width: 6rem; background: var(--bg-card); border: 0;
      padding: 0; cursor: pointer; color: var(--text-primary); font: inherit; border-radius: 0.5rem; overflow: hidden; }
    .rp-item-tile.is-selected { background: var(--bg-card-light); box-shadow: var(--rp-ring); }
    .rp-item-tile.is-selected .contrast-border-half { background: var(--bg-card-light); }
    .rp-item-thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: var(--bg-darker); }
    .rp-item-thumb-img { width: 100%; height: 100%; object-fit: cover; }
    .rp-item-thumb-fallback { display: block; width: 100%; height: 100%; }
    .rp-item-tile-name { font-size: 0.82rem; text-align: center; line-height: 1.15; overflow-wrap: anywhere; padding: 0.35rem 0.4rem 0.45rem; }
    .rp-item-detail { margin-top: 1rem; background: var(--bg-card); border-radius: 0.6rem; padding: 1rem 1.1rem; }
    .rp-item-detail-name { font-family: 'Stoke', serif; margin: 0 0 0.3rem; }
    .rp-item-detail-desc { color: var(--text-secondary); white-space: pre-wrap; margin: 0 0 0.75rem; }
    .rp-item-abilities { display: grid; grid-template-columns: 1fr; gap: 0.6rem; align-items: stretch; }
    @media (min-width: 620px) { .rp-item-abilities { grid-template-columns: 1fr 1fr; } }
    .rp-item-ability { background: var(--bg-card-light); border-radius: 0.5rem; padding: 0.7rem 0.75rem; }
    .rp-ability-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .rp-ability-head strong { font-family: 'Stoke', serif; font-size: 0.98rem; }
    .rp-item-ability-desc { margin: 0.15rem 0 0.4rem; color: var(--text-secondary); white-space: pre-wrap; font-size: 0.88rem; }

    /* Modifier rows (item detail + DM boss effects). */
    .rp-mod { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.35rem 0; }
    .rp-mod-info { display: flex; flex-direction: column; min-width: 0; }
    .rp-mod-meta { font-size: 0.8rem; color: var(--text-secondary); }
    .rp-mod-control { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }

    /* ── Personal buffs ── */
    .rp-buff-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .rp-buff-slot { background: var(--bg-darker); border-radius: 0.5rem; padding: 0.5rem 0.6rem; display: flex; flex-direction: column; gap: 0.15rem; }
    .rp-buff-slot.is-filled { background: var(--bg-card-light); }
    .rp-buff-slot-name { font-size: 0.85rem; }
    .rp-buff-slot.is-filled .rp-buff-slot-name { font-weight: 600; }
    .rp-buff-slot-meta { font-size: 0.72rem; color: var(--text-secondary); }
    .rp-buff-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .rp-buff-label { color: var(--text-secondary); font-size: 0.9rem; }
    .rp-buff-controls { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .rp-buff-dur { display: inline-flex; align-items: center; gap: 0.25rem; color: var(--text-secondary); font-size: 0.85rem; }
    .rp-buff-dur-input { width: 3.2rem; }
    .rp-buff-ctl { display: inline-flex; align-items: center; gap: 0.15rem; padding: 0.1rem 0.35rem; background: var(--bg-card-light); border-radius: 0.4rem; }
    .rp-buff-ctl > .material-symbols-outlined { font-size: 1.05rem; color: var(--text-secondary); }

    /* ── Active-skills modal ── */
    .rp-modal-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .rp-modal { background: var(--bg-card); border-radius: 0.75rem; width: min(460px, 100%); max-height: 80vh; overflow-y: auto;
      padding: 1rem 1.15rem; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .rp-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.1rem; }
    .rp-modal-head h3 { margin: 0; font-family: 'Stoke', serif; }
    .rp-modal-help { margin: 0.1rem 0 0.6rem; }
    .rp-skill-group { margin-top: 0.9rem; }
    /* Prominent section headings in the header font, per request. */
    .rp-skill-group-title { margin: 0 0 0.4rem; font-family: 'Stoke', serif; font-size: 0.9rem; color: var(--text-primary); }
    /* Each entry is a boxed card, like the DM boss rows, for clearer separation. */
    .rp-skill { background: var(--bg-card-light); border-radius: 0.5rem; margin-bottom: 0.4rem; }
    .rp-skill-head { display: flex; align-items: flex-start; gap: 0.5rem; width: 100%; background: none; border: 0; color: var(--text-primary);
      font: inherit; text-align: left; padding: 0.55rem 0.7rem; cursor: pointer; }
    .rp-skill-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
    .rp-skill-name { overflow-wrap: anywhere; }
    .rp-skill-sum { color: var(--text-secondary); font-size: 0.82rem; text-transform: capitalize; overflow-wrap: anywhere; }
    .rp-skill-caret { flex: 0 0 auto; font-size: 1.1rem; color: var(--text-secondary); margin-top: 0.1rem; }
    .rp-skill-body { padding: 0 0.7rem 0.55rem; }
    .rp-skill-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.15rem; }
    .rp-skill-desc { margin: 0; font-size: 0.85rem; color: var(--text-primary); white-space: pre-wrap; }
    .rp-skill-desc.rp-muted { color: var(--text-secondary); font-style: italic; }

    /* ── DM Control Deck (DM only) — its own darker band, collapsible ── */
    .rp-deck { background: var(--bg-darker); border-radius: 0.6rem; margin-bottom: 1.5rem; overflow: hidden; }
    .rp-deck-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding: 0.65rem 0.9rem; }
    .rp-deck-title { display: flex; align-items: center; gap: 0.5rem; background: none; border: 0; color: var(--text-primary); font: inherit;
      font-family: 'Stoke', serif; font-size: 1.1rem; cursor: pointer; }
    .rp-deck-title > .material-symbols-outlined { color: var(--accent-brown); }
    .rp-deck-head-ctl { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .rp-deck-toggle .material-icons { font-size: 1.1rem; }
    .rp-deck-body { padding: 0 0.9rem 0.9rem; }
    .rp-turn-badge { font-size: 0.72rem; padding: 0.15rem 0.55rem; border-radius: 2rem; background: var(--bg-card-light); color: var(--text-secondary); }
    .rp-turn-badge.is-locked { background: var(--accent-red); color: var(--rp-btn-ink); }
    .rp-dm-session { display: flex; gap: 0.4rem; margin: 0.4rem 0 0; flex-wrap: wrap; }
    .rp-dm-tabs { display: flex; gap: 0.25rem; margin: 0.75rem 0 0.5rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
    .rp-dm-tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-secondary); font: inherit;
      font-size: 0.9rem; padding: 0.3rem 0.7rem; cursor: pointer; }
    .rp-dm-tab.is-active { color: var(--text-primary); border-bottom-color: var(--accent-brown); }
    .rp-dm-section, .rp-dm-log, .rp-dm-boss { background: var(--bg-card); border-radius: 0.5rem; padding: 0.5rem 0.7rem; margin-top: 0.6rem; }
    .rp-dm-sub { margin: 0.75rem 0 0.4rem; font-family: 'Stoke', serif; font-size: 0.95rem; }
    .rp-dm-section > .rp-dm-sub:first-child, .rp-dm-log .rp-dm-sub { margin-top: 0.1rem; }
    .rp-effect { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.35rem 0; border-top: 1px solid var(--border-color); }
    .rp-effect:first-of-type { border-top: 0; }
    .rp-effect.is-off { opacity: 0.5; }
    .rp-effect-info { display: flex; flex-direction: column; min-width: 0; }
    .rp-effect-meta { font-size: 0.78rem; color: var(--text-secondary); }
    .rp-effect-ctl { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .rp-boss-add { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; }
    /* Selects sitting directly on the deck's lighter band need a darker fill to read. */
    .rp-boss-add .rp-select { flex: 1 1 14rem; background: var(--bg-card); }
    .rp-dm-boss.is-down { opacity: 0.55; }
    .rp-dm-boss-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .rp-dm-boss-head strong { font-family: 'Stoke', serif; }
    .rp-dm-boss-head .rp-effect-ctl { margin-left: auto; }
    .rp-dm-boss-toggle { display: inline-flex; align-items: center; gap: 0.35rem; background: none; border: 0; cursor: pointer; color: var(--text-primary); font: inherit; padding: 0; }
    .rp-dm-boss-toggle .material-icons { font-size: 1.1rem; color: var(--text-secondary); }
    .rp-dm-boss-count { font-size: 0.72rem; color: var(--text-secondary); }
    .rp-dm-boss-body { margin-top: 0.5rem; }
    .rp-vuln { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; padding: 0.4rem 0; border-top: 1px solid var(--border-color); margin-top: 0.3rem; }
    .rp-vuln-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
    .rp-boss-skill { background: var(--bg-card-light); border-radius: 0.4rem; padding: 0.5rem 0.6rem; margin-top: 0.45rem; }
    .rp-boss-skill-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .rp-boss-skill-head strong { font-family: 'Stoke', serif; }
    .rp-boss-skill-desc { margin: 0.15rem 0 0.3rem; font-size: 0.82rem; color: var(--text-secondary); white-space: pre-wrap; }
    .rp-boss-skill .rp-mod { padding: 0.35rem 0.55rem; background: var(--bg-card); border-radius: 0.4rem; margin-top: 0.3rem; }
    .rp-skill-picks { display: flex; flex-wrap: wrap; gap: 0.3rem 0.7rem; margin: 0.25rem 0 0.35rem; }
    .rp-skill-picks label { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; cursor: pointer; }
    .rp-hits { display: inline-flex; align-items: center; gap: 0.15rem; color: var(--text-secondary); font-size: 0.9rem; }
    .rp-hits-input { width: 3.2rem; padding: 0.2rem 0.3rem; text-align: center; font: inherit; font-variant-numeric: tabular-nums; }
    .rp-log-list { display: flex; flex-direction: column; max-height: 18rem; overflow-y: auto; }
    .rp-log { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.3rem 0; border-top: 1px solid var(--border-color); font-size: 0.82rem; }
    .rp-log:first-child { border-top: 0; }
    .rp-log-main { color: var(--text-primary); }
    .rp-log-delta { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rp-log-delta.is-up { color: var(--check-color); }
    .rp-log-delta.is-down { color: var(--accent-red); }
    .rp-log-delta.rp-log-note { color: var(--text-secondary); white-space: normal; text-align: right; }

    /* ── Notices, chips, gate ── */
    .rp-turn-notice { margin: 0 0 1rem; padding: 0.7rem 1rem; border-radius: 0.5rem; text-align: center; font-size: 0.98rem;
      background: color-mix(in srgb, var(--accent-red) 14%, transparent); color: var(--accent-red); }
    .rp-turn-notice.is-locked { background: color-mix(in srgb, var(--accent-red) 22%, transparent); }
    .rp-flash { padding: 0.5rem 0.75rem; border-radius: 0.4rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .rp-flash.error { background: color-mix(in srgb, var(--accent-red) 15%, transparent); color: var(--accent-red); }
    .rp-ko { background: color-mix(in srgb, var(--accent-red) 12%, transparent); color: var(--accent-red); }
    .rp-action-chip { display: inline-block; margin-top: 0.3rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      border-radius: 2rem; padding: 0.15rem 0.65rem; background: var(--bg-card-light); align-self: flex-end; }
    .rp-action-chip.is-ready { color: var(--accent-brown); }
    .rp-action-chip.is-used { color: var(--text-secondary); }
    .rp-action-chip.is-ko { color: var(--accent-red); }

    .rp-gate { max-width: 480px; margin: 4rem auto; text-align: center; background: var(--bg-card); border-radius: 0.75rem; padding: 2.5rem 2rem; }
    .rp-gate-icon { font-size: 3rem; color: var(--accent-brown); }
    .rp-gate h2 { font-family: 'Stoke', serif; margin: 0.75rem 0 0.5rem; }
    .rp-gate p { color: var(--text-secondary); margin: 0 0 1.25rem; }

    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
      line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
      word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
  </style>
</head>

  <div class="container">
    <div id="nav-placeholder"></div>
    <div id="app"></div>
    <div class="disclaimer">

    document.addEventListener('DOMContentLoaded', function () {
      var root = ReactDOM.createRoot(document.getElementById('app'));
      if (typeof RollCalculator !== 'undefined') {
        root.render(React.createElement(RollCalculator));
      } else {
        root.render(React.createElement('div', { className: 'rp-gate' }, 'Failed to load the calculator. Reload the page.'));
      }
    });
  </script>
  <script src="/pv/js/nav.js"></script>
</body>
